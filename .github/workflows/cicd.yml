name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: us-east-1

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc AWS, pull du lieu bang DVC, huan luyen, upload artifact len S3.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={creds['aws_access_key_id']}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={creds['aws_secret_access_key']}\n")
          print("Da nap AWS credentials tu secret STORAGE_CREDENTIALS.")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT
          echo "f1_score doc duoc tu report.json = $F1"

      - name: Upload model to Cloud Storage
        # Bonus 4: so sanh F1 moi voi F1 cua model dang chay truoc khi trien khai.
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import boto3, json, os, sys
          bucket = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          new = json.load(open("outputs/report.json"))
          new_f1 = new["f1_score"]

          old_f1 = None
          try:
              obj = s3.get_object(Bucket=bucket, Key="artifacts/current/report.json")
              old_f1 = json.loads(obj["Body"].read())["f1_score"]
          except Exception as e:
              print(f"Chua co report cu tren cloud ({e.__class__.__name__}).")

          if old_f1 is None:
              print(f"[Bonus 4] Lan trien khai dau tien. F1 moi = {new_f1:.4f}.")
          else:
              print(f"[Bonus 4] So sanh F1: moi={new_f1:.4f} | cu={old_f1:.4f}")
              if new_f1 < old_f1:
                  print(f"[Bonus 4] HUY TRIEN KHAI: F1 moi {new_f1:.4f} < F1 cu {old_f1:.4f}.")
                  print("[Bonus 4] Model cu tren cloud duoc giu nguyen, khong upload model moi.")
                  sys.exit(0)
              print("[Bonus 4] F1 moi >= F1 cu -> cho phep trien khai.")

          s3.upload_file("models/model.joblib", bucket, "artifacts/current/model.joblib")
          s3.upload_file("outputs/report.json", bucket, "artifacts/current/report.json")
          print(f"Da upload model.joblib va report.json len s3://{bucket}/artifacts/current/")
          PYEOF

      - name: Save reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          print(f"f1_score nhan duoc tu job train: {f1:.4f}")
          if f1 < 0.65:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai."
              )
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Cho phep trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for i in $(seq 1 10); do
              sleep 2
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              echo "Cho service khoi dong... lan $i"
            done
            echo "Health check that bai."
            sudo journalctl -u income-api -n 50
            exit 1
